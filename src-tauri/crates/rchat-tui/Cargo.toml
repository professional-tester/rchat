[package]
name = "rchat-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25", default-features = false }
ratatui = "0.30.1"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults", "tokio"] }
rchat-core = { path = "../rchat-core" }
rchat-screen-capture = { path = "../rchat-screen-capture" }
rpassword = "7.4.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23.0"
